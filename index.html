<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas Starfield</title>
  <style>
    html,body { height:100%; margin:0; }
    canvas { position:fixed; inset:0; z-index:-2; display:block; }
    .overlay { position:fixed; inset:0; background:rgba(4,6,11,0.5); z-index:-1; }
    .hero { position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; text-align:center; padding:2rem; font-family:system-ui,Arial,sans-serif; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="overlay" aria-hidden="true"></div>

  <main class="hero">
    <div>
      <h1 style="margin:0 0 .5rem">Welcome</h1>
      <p style="margin:0">A subtle animated starfield made with canvas.</p>
    </div>
  </main>

  <script>
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      // Don't animate if user prefers reduced motion
      document.getElementById('bg').style.display = 'none';
    } else {
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = innerWidth;
      let h = canvas.height = innerHeight;
      const particles = [];
      const count = Math.max(60, Math.floor((w * h) / 8000));

      function rand(min, max){ return Math.random() * (max - min) + min; }

      function createParticles(){
        particles.length = 0;
        for (let i=0;i<count;i++){
          particles.push({
            x: Math.random()*w,
            y: Math.random()*h,
            vx: rand(-0.2, 0.2),
            vy: rand(-0.15, 0.2),
            r: rand(0.6, 1.8),
            alpha: rand(0.2, 0.9)
          });
        }
      }

      function resize(){
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
        createParticles();
      }
      addEventListener('resize', resize);
      createParticles();

      function draw(){
        ctx.clearRect(0,0,w,h);
        // subtle glow
        ctx.fillStyle = 'rgba(8,12,20,0.25)';
        ctx.fillRect(0,0,w,h);

        for (const p of particles){
          p.x += p.vx;
          p.y += p.vy;
          // wrap
          if (p.x > w + 10) p.x = -10;
          if (p.x < -10) p.x = w + 10;
          if (p.y > h + 10) p.y = -10;
          if (p.y < -10) p.y = h + 10;

          ctx.beginPath();
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*10);
          grad.addColorStop(0, `rgba(255,255,255,${p.alpha})`);
          grad.addColorStop(0.5, `rgba(120,180,255,${p.alpha*0.25})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.arc(p.x, p.y, p.r*4, 0, Math.PI*2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
