<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Home</title>
  <meta name="description" content="Welcome — animated homepage with subtle starfield and gradient background." />

  <style>
    /* Palette: dark grey + white */
    :root{
      --bg-1: #0b0d10;        /* very dark grey (near black) */
      --bg-2: #101316;        /* slightly lighter */
      --panel: rgba(255,255,255,0.03);
      --panel-2: rgba(255,255,255,0.02);
      --accent-light: #ffffff; /* white for highlights & text */
      --muted: #bfc7cf;       /* light grey for secondary text */
      --glass: rgba(255,255,255,0.04);
      --max-width: 1100px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
    body{
      color:var(--accent-light);
      background: linear-gradient(180deg,var(--bg-1) 0%, var(--bg-2) 60%);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    .gradient-bg{
      position:fixed;
      inset:-15%;
      z-index:-3;
      background: linear-gradient(45deg, #0b0e12 0%, #121417 40%, #0b0e12 70%, #0e1113 100%);
      background-size: 1600% 1600%;
      filter: saturate(100%) blur(20px);
      transform: translateZ(0);
      animation: gradientShift 30s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes gradientShift{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    canvas#bg{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:-2;
      display:block;
      pointer-events:none;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(5,7,10,0.48);
      z-index:-1;
      pointer-events:none;
    }

    header{
      position:fixed;
      top:18px;
      left:0;
      right:0;
      display:flex;
      justify-content:center;
      z-index:20;
      padding:0 20px;
      pointer-events:none;
    }
    .nav {
      width:100%;
      max-width:var(--max-width);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      pointer-events:auto;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--accent-light);
      text-decoration:none;
      font-weight:600;
      font-size:1.05rem;
    }
    .brand .logo {
      width:36px; height:36px; border-radius:8px;
      background:linear-gradient(135deg,#131516,#232629);
      box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 -6px 12px rgba(255,255,255,0.02);
      display:inline-block;
      border:1px solid rgba(255,255,255,0.03);
    }
    nav ul{display:flex;gap:12px;align-items:center;list-style:none;padding:0;margin:0}
    nav a {
      color:var(--accent-light); text-decoration:none; font-size:.95rem;
      padding:8px 10px; border-radius:8px; transition:background .18s, transform .12s;
    }
    nav a:hover, nav a:focus{background:var(--glass); transform:translateY(-2px); outline:none}
    .cta {
      background:var(--accent-light);
      color:#071011;
      padding:8px 12px;
      border-radius:10px;
      font-weight:700;
      box-shadow: 0 6px 22px rgba(0,0,0,0.5);
    }

    main.hero {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:3rem 20px;
      text-align:center;
    }
    .panel {
      width:100%;
      max-width:900px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border-radius:14px;
      padding:48px;
      backdrop-filter: blur(6px) saturate(110%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }
    h1{font-size:clamp(2.2rem,6vw,3.6rem); margin:0 0 .6rem; line-height:1.02}
    p.lead{margin:0 0 1.25rem; color:var(--muted); font-size:1.05rem}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    button.btn{
      border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;
      background:rgba(255,255,255,0.03); color:var(--accent-light); transition:transform .14s, box-shadow .14s;
    }
    button.btn:hover{transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    button.primary{background:var(--accent-light); color:#071011; box-shadow:0 10px 30px rgba(0,0,0,0.18)}

    .hint{margin-top:16px;color:rgba(191,199,207,0.7);font-size:.88rem}

    @media (max-width:720px){
      .nav{padding:6px 0}
      .panel{padding:28px}
      header{top:12px}
    }

    @media (prefers-reduced-motion: reduce){
      .gradient-bg { animation: none; filter: none; }
      canvas#bg { display:none; }
      * { transition: none !important; animation: none !important; }
    }

    :focus{outline:2px dashed rgba(255,255,255,0.12); outline-offset:4px}
  </style>
</head>
<body>
  <div class="gradient-bg" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="overlay" aria-hidden="true"></div>

  <header>
    <div class="nav" role="navigation" aria-label="Top navigation">
      <a class="brand" href="#">
        <span class="logo" aria-hidden="true"></span>
        <span class="name">YourSite</span>
      </a>

      <nav>
        <ul>
          <li><a href="#features">Features</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a class="cta" href="#start">Get Started</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="hero" role="main">
    <section class="panel" aria-labelledby="hero-title">
      <h1 id="hero-title">Crafted for curiosity. Built to amaze.</h1>
      <p class="lead">A minimal, high-contrast homepage using a dark grey & white palette with subtle animated depth.</p>

      <div class="actions" role="region" aria-label="Primary actions">
        <button class="btn primary" onclick="location.href='#start'">Get started</button>
        <button class="btn" onclick="location.href='#learn'">Learn more</button>
      </div>

      <div class="hint">Tip: move your mouse to create a gentle parallax on the stars (or tap on touch devices).</div>
    </section>
  </main>

  <script>
    (function(){
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) return;

      const canvas = document.getElementById('bg');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');

      let w = canvas.width = innerWidth;
      let h = canvas.height = innerHeight;
      let DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * DPR);
      canvas.height = Math.round(h * DPR);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(DPR, DPR);

      const area = w * h;
      let baseCount = Math.max(50, Math.floor(area / 8000));
      const isMobile = /Mobi|Android/i.test(navigator.userAgent) || Math.min(w,h) < 600;
      if (isMobile) baseCount = Math.max(30, Math.floor(baseCount * 0.6));

      const particles = [];
      const mouse = { x: w/2, y: h/2, vx:0, vy:0, active:false };

      function rand(min, max){ return Math.random() * (max-min) + min; }

      function makeParticle(){
        const speed = isMobile ? rand(0.08, 0.35) : rand(0.12, 0.6);
        return {
          x: rand(0, w),
          y: rand(0, h),
          vx: rand(-speed, speed),
          vy: rand(-speed*0.6, speed*0.6),
          r: rand(0.6, 2.4),
          alpha: rand(0.12, 0.9),
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: rand(0.002, 0.01)
        };
      }

      function createParticles(){
        particles.length = 0;
        for (let i=0;i<baseCount;i++) particles.push(makeParticle());
      }

      function resize(){
        w = canvas.width = innerWidth;
        h = canvas.height = innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * DPR);
        canvas.height = Math.round(h * DPR);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        const newBase = Math.max(50, Math.floor((w*h)/8000));
        baseCount = isMobile ? Math.max(30, Math.floor(newBase*0.6)) : newBase;
        createParticles();
      }

      addEventListener('resize', debounce(resize, 200));

      function onMove(e){
        mouse.active = true;
        const rect = canvas.getBoundingClientRect();
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        mouse.vx += (x - mouse.x) * 0.08;
        mouse.vy += (y - mouse.y) * 0.08;
        mouse.x = x;
        mouse.y = y;
      }
      addEventListener('pointermove', throttle(onMove, 16), {passive:true});
      addEventListener('touchstart', onMove, {passive:true});
      addEventListener('touchmove', throttle(onMove, 16), {passive:true});

      let running = true;
      document.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running) loop();
      });

      let last = performance.now();
      function draw(now){
        const dt = Math.min(32, now - last);
        last = now;
        ctx.clearRect(0,0,w,h);

        ctx.fillStyle = 'rgba(3,6,10,0.18)';
        ctx.fillRect(0,0,w,h);

        const px = (mouse.x - w/2) * 0.02;
        const py = (mouse.y - h/2) * 0.02;

        for (let p of particles){
          p.twinkle += p.twinkleSpeed * dt;
          const tw = (Math.sin(p.twinkle) * 0.4) + 0.6;
          const alpha = Math.max(0.06, Math.min(1, p.alpha * tw));

          const pullX = (mouse.x - p.x) * 0.00012;
          const pullY = (mouse.y - p.y) * 0.00008;
          p.vx += pullX * (mouse.active ? 1.0 : 0.05);
          p.vy += pullY * (mouse.active ? 1.0 : 0.05);

          p.x += p.vx * (dt * 0.06);
          p.y += p.vy * (dt * 0.06);

          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;
          if (p.y < -20) p.y = h + 20;
          if (p.y > h + 20) p.y = -20;

          const radius = p.r * (1 + tw*0.6);
          const grad = ctx.createRadialGradient(p.x + px, p.y + py, 0, p.x + px, p.y + py, radius*6);
          grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
          grad.addColorStop(0.35, `rgba(255,255,255,${alpha*0.22})`);
          grad.addColorStop(0.8, `rgba(200,200,200,${alpha*0.06})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.beginPath();
          ctx.fillStyle = grad;
          ctx.arc(p.x + px* (p.r*0.15), p.y + py* (p.r*0.15), radius*3, 0, Math.PI*2);
          ctx.fill();
        }
      }

      let rafId = null;
      function loop(now){
        if (!running) return;
        draw(now || performance.now());
        rafId = requestAnimationFrame(loop);
      }

      function debounce(fn, wait){
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); };
      }
      function throttle(fn, wait){
        let last = 0;
        return (...args) => {
          const now = Date.now();
          if (now - last >= wait){ last = now; fn.apply(this,args); }
        };
      }

      createParticles();
      loop();

      addEventListener('pagehide', () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
      });

      let idle;
      function resetIdle(){ mouse.active = true; clearTimeout(idle); idle = setTimeout(()=>{mouse.active=false;}, 1200); }
      addEventListener('pointermove', resetIdle, {passive:true});
      addEventListener('touchmove', resetIdle, {passive:true});
      resetIdle();

    })();
  </script>
</body>
</html>
